:15px;padding:17px;min-width:0}.metric-card .number{font-size:clamp(18px,4vw,25px);margin-top:7px;overflow-wrap:anywhere}.green{color:var(--green)}.negative{color:var(--red)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics .metric-card.wide{grid-column:span 2}.divider{height:1px;background:var(--line);margin:15px 0}.row-title{font-size:15px;font-weight:720;letter-spacing:-.2px}.pill{font-size:10px;font-weight:680;color:var(--muted);background:var(--shade);border-radius:40px;padding:6px 10px}.pill.confirmed{background:#e8f4eb;color:var(--green)}.pill.planned{background:#fff4e6;color:#986321}.pill.pending{background:#fff4e6;color:#986321}.pill.delivered{background:#e8f4eb;color:#176341}.pill.cancelled,.pill.returned{background:#f9eaea;color:#a4423f}.dividerline{border-bottom:1px solid var(--line)}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0}.item:not(:last-child){border-bottom:1px solid var(--line)}.item-name{font-size:13px;font-weight:650}.item-sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.3}.item-price{font-size:14px;font-weight:730;white-space:nowrap}.item-right{display:flex;align-items:center;gap:8px}.arrow{color:#a5a7a5;font-size:20px}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 12px}.section-heading h2{margin:0;font-size:17px;letter-spacing:-.3px}.nav{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:7px max(env(safe-area-inset-right),12px) max(env(safe-area-inset-bottom),10px) max(env(safe-area-inset-left),12px);display:flex;justify-content:center;z-index:15}.nav-inner{display:flex;width:100%;max-width:740px;justify-content:space-around}.nav-item{border:0;background:transparent;color:#8c908b;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;padding:7px 3px}.nav-item.active{color:var(--ink);font-weight:780}.nav-item svg{width:19px;height:19px}.bare{background:none;border:0;color:var(--ink);padding:6px}.backrow{display:flex;align-items:center;gap:9px;margin:20px 0 0}.drop-selector{display:flex;align-items:center;gap:7px;font-size:12px;color:#505850}.compact-note{font-size:11px;color:#888e89;line-height:1.6}.note{background:#edf3ef;border-radius:12px;padding:13px 14px;font-size:12px;line-height:1.55;color:#43604d}.warning-note{background:#fff6e8;color:#96692a}.blank{padding:37px 18px;text-align:center;border:1px dashed #d5d8d2;border-radius:17px;background:#fbfcfa;color:var(--muted)}.blank strong{display:block;color:var(--ink);margin-bottom:8px;font-size:15px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.progress{width:100%;height:5px;border-radius:8px;background:#ecefeb;overflow:hidden;margin-top:12px}.progress>span{display:block;height:100%;background:var(--accent);border-radius:8px}.mini-stat{font-size:12px;color:var(--muted);margin:8px 0 0}.filter{display:flex;gap:7px;overflow:auto;padding:1px 1px 12px;scrollbar-width:none}.filter::-webkit-scrollbar{display:none}.chip{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:28px;font-size:11px;white-space:nowrap;color:var(--muted)}.chip.active{background:var(--ink);color:white;border-color:var(--ink)}.sheet-backdrop{position:fixed;inset:0;background:#14201985;z-index:90;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,640px);background:white;border-radius:24px 24px 0 0;padding:22px 22px max(25px,env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;box-shadow:0 -10px 35px #0001}.sheet h2{font-size:20px;letter-spacing:-.5px;margin:0 0 18px}.sheet-handle{height:5px;width:34px;background:#d5d9d4;border-radius:3px;margin:-10px auto 21px}.field{display:flex;flex-direction:column;gap:7px;margin:0 0 15px}.field label{font-size:12px;font-weight:630;color:#4c514d}.field input,.field select,.field textarea{border:1px solid #dfe2dc;border-radius:11px;padding:13px 12px;background:#fbfcfa;font-size:15px;color:var(--ink);width:100%;min-height:46px}.field textarea{min-height:80px;resize:vertical}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;gap:9px;margin-top:18px}.form-actions button{flex:1}.form-delete{background:transparent;color:var(--red);border:0;font-weight:630;font-size:12px;padding:10px 0 0}.muted-link{font-size:12px;color:#6d746d;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0}.toggleline{display:flex;align-items:center;gap:8px;font-size:13px;color:#424a43;margin:8px 0 18px}.toggleline input{width:18px;height:18px;accent-color:var(--accent)}.order-lines{display:grid;gap:8px}.order-line{display:grid;grid-template-columns:1.4fr .48fr .76fr 30px;gap:6px;align-items:end}.order-line label{font-size:10px}.order-line input,.order-line select{padding:10px 7px;font-size:12px;min-height:41px}.remove-line{border:none;background:#f5f5f3;border-radius:9px;padding:9px 7px;color:#ad4c47;height:40px}.form-footnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:7px}.spacer{height:6px}.amount-lead{font-size:32px;font-weight:775;letter-spacing:-1.3px;margin:12px 0 3px}.trend{display:flex;align-items:center;gap:8px}.target-row{display:grid;grid-template-columns:1.1fr 1fr 60px;align-items:center;gap:10px;margin:14px 0}.bar{background:#edf0eb;height:6px;border-radius:6px;overflow:hidden}.bar span{display:block;height:100%;background:#455d4d}.toast{position:fixed;z-index:200;bottom:94px;left:50%;transform:translateX(-50%);border-radius:13px;background:var(--ink);color:white;padding:12px 19px;box-shadow:0 8px 25px #0002;font-size:12px;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:750px){.shell{padding:0 30px 110px}.page-intro{margin-top:34px}.sheet-backdrop{align-items:center}.sheet{border-radius:22px;max-height:87dvh}.nav{bottom:15px;left:50%;right:auto;transform:translateX(-50%);width:475px;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 35px #00000011;padding:7px}}
@media(max-width:360px){.shell{padding-left:14px;padding-right:14px}.number{font-size:20px}.h1{font-size:28px}.page-intro{gap:3px}.title{font-size:16px}.metric-card{padding:13px}}

<body>
<div id="app"><div class="boot">UNLISTED<span>™</span></div></div>
<script>
/* UNLISTED Finance Manager — offline-first personal finance PWA. No remote analytics or external dependencies. */
'use strict';
const APP_KEY='unlisted-finance-v1';
const DB_NAME='unlisted-finance-store';
const CATEGORIES=['Fabric','Manufacturing','Packaging','Transport','Samples','Patterns','Marketing','Content','Shipping','Other'];
const ICONS={
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 next:'<path d="m9 18 6-6-6-6"/>',
 chart:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 15V9m5 6V6m5 9v-4"/>',
 layers:'<path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',
 receipt:'<path d="M4 3h16v18l-4-2-4 2-4-2-4 2V3Zm4 5h8M8 12h8"/>',
 bag:'<path d="M5 8h14l1 13H4L5 8Zm4 0V6a3 3 0 0 1 6 0v2"/>',
 box:'<path d="m3 7 9-4 9 4v10l-9 4-9-4V7Zm0 0 9 5 9-5m-9 5v9"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.8 1.8 0 0 0 .4 2l-2 2a1.8 1.8 0 0 0-2-.4 1.8 1.8 0 0 0-1.2 1.8h-3a1.8 1.8 0 0 0-1.2-1.8 1.8 1.8 0 0 0-2 .4l-2-2a1.8 1.8 0 0 0 .4-2A1.8 1.8 0 0 0 5 13.8v-3.6A1.8 1.8 0 0 0 6.8 9a1.8 1.8 0 0 0-.4-2l2-2a1.8 1.8 0 0 0 2 .4A1.8 1.8 0 0 0 11.6 3h3a1.8 1.8 0 0 0 1.2 2.4 1.8 1.8 0 0 0 2-.4l2 2a1.8 1.8 0 0 0-.4 2 1.8 1.8 0 0 0 1.6 1.2v3.6A1.8 1.8 0 0 0 19.4 15Z"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4 10.5-10.5Z"/>',
 cloud:'<path d="M20 17a4 4 0 0 0-1-7.9A7 7 0 0 0 5.3 10 4 4 0 0 0 6 18h14Z"/>',
 arrowdown:'<path d="M12 3v14m-5-5 5 5 5-5M5 21h14"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/>',
 check:'<path d="m4 12 5 5L20 6"/>',
 close:'<path d="m18 6-12 12M6 6l12 12"/>',
 more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 wifi:'<path d="M3 9a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0m-9 3a4.5 4.5 0 0 1 6 0M12 19h.01"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>',
 calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M8 2v4m8-4v4M3 10h18"/>'};
const ico=(key)=>`<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]||ICONS.box}</svg>`;
const id=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
const h=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const egp=(n,decimals=0)=>`${(Number(n)||0).toLocaleString('en-EG',{minimumFractionDigits:decimals,maximumFractionDigits:decimals})} EGP`;
const num=(x)=>{let v=Number(x);return Number.isFinite(v)?Math.max(0,v):0};
const total=(list,fn)=>list.reduce((acc,x)=>acc+fn(x),0);
const shortDate=(d)=>d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const seed=()=>({
 schema:1,activeDropId:'drop-2',
 drops:[{id:'drop-2',name:'Drop 2 — Winter',created:new Date().toISOString().slice(0,10),shippingEstimate:40,products:[],expenses:[],orders:[],targets:{production:40,marketing:20,content:5,profit:30}}]
});
let data=null, page='drops', filter='All', modal=null, toastTimer=null, db=null;
const current=()=>data.drops.find(d=>d.id===data.activeDropId)||data.drops[0];
const findProduct=(d,pid)=>d.products.find(p=>p.id===pid);
const shippedLines=(d)=>d.orders.filter(o=>o.status==='delivered').flatMap(o=>o.lines);
function stats(d){
 const pieces=total(d.products,p=>num(p.quantity));
 const expenseAll=total(d.expenses,e=>num(e.amount));
 const expenseRecorded=total(d.expenses.filter(e=>!e.planned),e=>num(e.amount));
 const expPlanned=expenseAll-expenseRecorded;
 const billedShipping=total(d.orders.filter(o=>o.courierCharged),o=>num(o.courierFee));
 const productSales=total(d.orders.filter(o=>o.status==='delivered'),o=>Math.max(0,total(o.lines,l=>num(l.quantity)*num(l.price))-num(o.discount)));
 const customerShipping=total(d.orders.filter(o=>o.status==='delivered'),o=>num(o.customerShipping));
 const collected=productSales+customerShipping;
 const deliveredQtyById={};
 for(const line of shippedLines(d))deliveredQtyById[line.productId]=(deliveredQtyById[line.productId]||0)+num(line.quantity);
 const deliveredPieces=Object.values(deliveredQtyById).reduce((a,b)=>a+b,0);
 const remainingProducts=d.products.map(p=>({...p,left:Math.max(0,num(p.quantity)-(deliveredQtyById[p.id]||0))}));
 const remainingPieces=total(remainingProducts,p=>p.left);
 const remainingRevenue=total(remainingProducts,p=>p.left*num(p.price));
 const remainingShipping=remainingPieces*num(d.shippingEstimate);
 const projectedRevenue=collected+remainingRevenue;
 const projectedCost=expenseAll+billedShipping+remainingShipping;
 const projectedProfit=projectedRevenue-projectedCost;
 const netToDate=collected-expenseRecorded-billedShipping;
 return {pieces,expenseAll,expenseRecorded,expPlanned,billedShipping,productSales,customerShipping,collected,deliveredQtyById,deliveredPieces,remainingProducts,remainingPieces,remainingRevenue,remainingShipping,projectedRevenue,projectedCost,projectedProfit,netToDate,unitCost:pieces?projectedCost/pieces:0};
}
function productUnitCost(d,p){
 const shared=total(d.expenses.filter(e=>e.scope==='all'&&!['Marketing','Content','Shipping'].includes(e.category)),e=>num(e.amount));
 const assigned=total(d.expenses.filter(e=>e.scope===p.id&&!['Marketing','Content','Shipping'].includes(e.category)),e=>num(e.amount));
 const qty=total(d.products,x=>num(x.quantity));
 return (qty?shared/qty:0)+(num(p.quantity)?assigned/num(p.quantity):0)+num(d.shippingEstimate);
}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){resolve(null);return;}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function dbGet(){return new Promise(resolve=>{if(!db){resolve(null);return;}let tx=db.transaction('data','readonly'),req=tx.objectStore('data').get(APP_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null);});}
function dbPut(payload){if(!db)return;try{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(payload,APP_KEY);}catch(e){console.warn('IndexedDB save failed',e);}}
function save(){try{localStorage.setItem(APP_KEY,JSON.stringify(data));}catch(e){console.warn('LocalStorage save failed',e);notify('Storage is full — please export a backup');}dbPut(data);render();}
async function init(){try{db=await openDB();}catch(e){db=null;}
 let stored=await dbGet();if(!stored){try{stored=JSON.parse(localStorage.getItem(APP_KEY)||'null');}catch(e){stored=null;}}
 data=stored&&Array.isArray(stored.drops)?stored:seed();if(!data.drops.length)data=seed();if(!current())data.activeDropId=data.drops[0].id;page='drops';render();
 if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(e=>console.info('Offline installation unavailable',e));
}
function header(){return `<header class="top"><div class="wordmark">UNLISTED<sup>™</sup></div><div class="header-right"><button class="icon-button" data-action="backup" aria-label="Export backup" title="Export backup">${ico('arrowdown')}</button><button class="icon-button" data-action="settings" aria-label="Settings">${ico('settings')}</button></div></header>`;}
function nav(){const screens=page==='drops'||page==='settings'?[['drops','Drops','layers'],['settings','Settings','settings']]:[['overview','Overview','chart'],['expenses','Expenses','receipt'],['orders','Orders','bag'],['products','Products','box']];return `<nav class="nav"><div class="nav-inner">${screens.map(([key,label,icon])=>`<button class="nav-item ${page===key?'active':''}" data-action="navigate" data-page="${key}">${ico(icon)}${label}</button>`).join('')}</div></nav>`;}
function backrow(){return `<div class="backrow"><button class="back-btn" data-action="navigate" data-page="drops" aria-label="All Drops">${ico('back')}</button><button class="bare drop-selector" data-action="navigate" data-page="drops">All drops ${ico('next')} <strong>${h(current().name)}</strong></button></div>`;}
function metric(label,value,wide=false,green=false,footer=''){return `<div class="metric-card ${wide?'wide':''}"><div class="label">${label}</div><div class="number ${green?(String(value).startsWith('-')?'negative':'green'):''}">${value}</div>${footer?`<div class="mini-stat">${footer}</div>`:''}</div>`;}
function renderDrops(){return `<section class="page-intro"><div><div class="eyebrow">Finance Manager</div><h1 class="h1">Your drops</h1><p class="sub">All your numbers. One clean place.</p></div><button class="primary" data-action="add-drop"><span class="mini-plus">+</span> Add Drop</button></section>${data.drops.map(d=>{const s=stats(d);return `<button class="card drop-card" data-action="open-drop" data-id="${h(d.id)}"><div class="spread"><div><div class="title">${h(d.name)}</div><div class="item-sub">${s.pieces} pieces · ${d.products.length} products</div></div><span class="arrow">›</span></div><div class="divider"></div><div class="metrics"><div><div class="label">Projected costs</div><div class="number">${egp(s.projectedCost)}</div></div><div><div class="label">Projected profit</div><div class="number ${s.projectedProfit>=0?'green':'negative'}">${egp(s.projectedProfit)}</div></div></div><div class="progress"><span style="width:${Math.min(100,s.pieces?s.deliveredPieces/s.pieces*100:0)}%"></span></div><div class="mini-stat">${s.deliveredPieces} of ${s.pieces} pieces delivered</div></button>`}).join('')}<div class="note">${ico('shield')} Financial entries are saved locally on this device. You can export a backup in Settings. Cloud sync is not connected yet.</div>`;}
function renderOverview(){const d=current(),s=stats(d);return `${backrow()}<section class="page-intro"><div><div class="eyebrow">Drop overview</div><h1 class="h1">${h(d.name)}</h1><p class="sub">${s.pieces} pieces · ${s.deliveredPieces} delivered</p></div><button class="secondary small" data-action="edit-drop">${ico('edit')} Edit</button></section><div class="metrics">${metric('Delivered revenue',egp(s.collected),false,false,'Only completed deliveries')}${metric('Projected total cost',egp(s.projectedCost),false,false,'Includes planned shipping')}${metric('Projected full-drop profit',egp(s.projectedProfit),true,true,'Based on remaining stock selling at current prices')}</div><section class="section-heading"><h2>Quick actions</h2></section><div class="card"><div class="actions"><button class="primary small" data-action="add-expense">+ Expense</button><button class="secondary small" data-action="add-order">+ Order</button><button class="secondary small" data-action="add-product">+ Product</button></div></div><section class="section-heading"><h2>Where the money goes</h2><button class="muted-link" data-action="navigate" data-page="expenses">All expenses</button></section><div class="card">${categorySummary(d,s)}<div class="divider"></div><div class="spread"><span class="label">Entered costs</span><strong>${egp(s.expenseAll)}</strong></div><div class="spread" style="margin-top:12px"><span class="label">Shipping: billed + future estimate</span><strong>${egp(s.billedShipping+s.remainingShipping)}</strong></div></div><section class="section-heading"><h2>Products</h2><button class="muted-link" data-action="navigate" data-page="products">View products</button></section><div class="card">${d.products.length?d.products.map(p=>`<div class="item"><div><div class="item-name">${h(p.name)}</div><div class="item-sub">${p.quantity} pieces · estimated ${egp(productUnitCost(d,p),2)} per piece</div></div><div class="item-price">${egp(p.price)}</div></div>`).join(''):'<div class="blank">No products yet</div>'}</div><p class="compact-note">Projected profit is a forecast, not money received. Actual revenue counts delivered orders only. The cost estimate replaces the shipping allowance with real courier charges as orders are delivered.</p>`;}
function categorySummary(d,s){const cats=[['Product & production',e=>!['Marketing','Content','Shipping'].includes(e.category)],['Marketing',e=>e.category==='Marketing'],['Content',e=>e.category==='Content'],['Other shipping',e=>e.category==='Shipping']];return cats.map(([name,fn])=>{const amount=total(d.expenses.filter(fn),e=>num(e.amount));return `<div class="item"><div class="item-name">${name}</div><div class="item-price">${egp(amount)}</div></div>`}).join('');}
function renderExpenses(){const d=current(),s=stats(d);const filters=['All',...new Set([...d.expenses.map(e=>e.category),...['Marketing','Content','Shipping','Other']])];const exp=filter==='All'?d.expenses:d.expenses.filter(e=>e.category===filter);return `${backrow()}<section class="page-intro"><div><div class="eyebrow">Track costs</div><h1 class="h1">Expenses</h1><p class="sub">${d.expenses.length} entries · ${egp(s.expenseAll)} total</p></div><button class="primary" data-action="add-expense"><span class="mini-plus">+</span> Add</button></section><div class="metrics" style="margin-bottom:16px">${metric('Recorded costs',egp(s.expenseRecorded))}${metric('Planned costs',egp(s.expPlanned))}</div><div class="filter">${filters.map(f=>`<button class="chip ${filter===f?'active':''}" data-action="filter" data-filter="${h(f)}">${h(f)}</button>`).join('')}</div><div class="card">${exp.length?exp.map(e=>`<button class="item" style="width:100%;border-left:0;border-right:0;border-top:0;background:white;text-align:left" data-action="edit-expense" data-id="${h(e.id)}"><div><div class="item-name">${h(e.name)}</div><div class="item-sub">${h(e.category)} · ${e.scope==='all'?'All products':h(findProduct(d,e.scope)?.name||'Unassigned')}</div></div><div class="item-right"><div style="text-align:right"><div class="item-price">${egp(e.amount)}</div><span class="pill ${e.planned?'planned':'confirmed'}">${e.planned?'Planned':'Recorded'}</span></div><span class="arrow">›</span></div></button>`).join(''):'<div class="blank"><strong>No expenses here</strong>Tap Add to record one.</div>'}</div><p class="compact-note">Recorded means entered as a cost; it does not confirm that a payment was made. Planned costs are included in forecasts but separated above.</p>`;}
function renderOrders(){const d=current(),s=stats(d);const statuses=['pending','delivered','cancelled','returned'];return `${backrow()}<section class="page-intro"><div><div class="eyebrow">Delivery-based sales</div><h1 class="h1">Orders</h1><p class="sub">Revenue is recognized only when delivered</p></div><button class="primary" data-action="add-order"><span class="mini-plus">+</span> Add</button></section><div class="metrics" style="margin-bottom:17px">${metric('Delivered revenue',egp(s.collected))}${metric('Billed courier fees',egp(s.billedShipping))}</div><div class="card"><div class="spread"><span class="label">Orders by status</span><span class="pill">${d.orders.length} total</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:17px">${statuses.map(status=>`<div><div class="number" style="font-size:20px">${d.orders.filter(o=>o.status===status).length}</div><div class="label" style="font-size:10px;text-transform:capitalize">${status}</div></div>`).join('')}</div></div><section class="section-heading"><h2>All orders</h2></section><div class="card">${d.orders.length?[...d.orders].reverse().map(o=>`<button class="item" style="width:100%;background:white;border:0;border-bottom:1px solid var(--line);text-align:left" data-action="edit-order" data-id="${h(o.id)}"><div><div class="item-name">${h(o.ref||'Order')}</div><div class="item-sub">${h(shortDate(o.date))} · ${o.lines.map(l=>`${num(l.quantity)}× ${h(findProduct(d,l.productId)?.name||'Deleted product')}`).join(', ')}</div></div><div class="item-right"><div style="text-align:right"><div class="item-price">${egp(Math.max(0,total(o.lines,l=>num(l.quantity)*num(l.price))-num(o.discount))+num(o.customerShipping))}</div><span class="pill ${h(o.status)}">${h(o.status)}</span></div><span class="arrow">›</span></div></button>`).join(''):'<div class="blank"><strong>No orders yet</strong>Add your first order. Courier charges and customer shipping are tracked separately.</div>'}</div><div class="note warning-note">Cancelled or returned orders add no revenue. If a courier charged you anyway, tick “Courier fee charged” in that order so the real expense is included.</div>`;}
function renderProducts(){const d=current(),s=stats(d);return `${backrow()}<section class="page-intro"><div><div class="eyebrow">Inventory and prices</div><h1 class="h1">Products</h1><p class="sub">Set each product's price and quantity</p></div><button class="primary" data-action="add-product"><span class="mini-plus">+</span> Add</button></section><div class="card">${d.products.map(p=>`<button class="item" data-action="edit-product" data-id="${h(p.id)}" style="width:100%;background:white;border-top:0;border-left:0;border-right:0;text-align:left"><div><div class="item-name">${h(p.name)}</div><div class="item-sub">${num(p.quantity)} produced · ${s.deliveredQtyById[p.id]||0} delivered · ${Math.max(0,num(p.quantity)-(s.deliveredQtyById[p.id]||0))} remaining</div><div class="item-sub">Estimated cost / piece ${egp(productUnitCost(d,p),2)}</div></div><div class="item-right"><div class="item-price">${egp(p.price)}</div><span class="arrow">›</span></div></button>`).join('')||'<div class="blank"><strong>No products yet</strong>Add a product to start your drop.</div>'}</div><div class="card"><div class="row-title">How product costs work</div><p class="compact-note">Expenses assigned to a specific product affect only its cost. Shared production expenses are split across all pieces. Your estimated shipping allowance is added to the unit forecast, then replaced by actual order charges as deliveries happen.</p><div class="divider"></div><div class="spread"><span class="label">Default shipping estimate per unsold piece</span><strong>${egp(d.shippingEstimate)}</strong></div><button class="secondary small" style="margin-top:13px" data-action="edit-drop">Edit estimate</button></div>`;}
function renderSettings(){return `<section class="page-intro"><div><div class="eyebrow">Preferences</div><h1 class="h1">Settings</h1><p class="sub">Your data and backups</p></div></section><div class="card"><div class="row-title">Local data</div><p class="compact-note">This app keeps your entries in your browser on this device. It works without internet after it has been installed from a secure website and opened once.</p><div class="divider"></div><div class="item"><div><div class="item-name">Export your backup</div><div class="item-sub">Save or share a JSON backup to Files / iCloud Drive</div></div><button class="secondary small" data-action="backup">${ico('arrowdown')} Backup</button></div><div class="item"><div><div class="item-name">Restore a backup</div><div class="item-sub">Import a previously saved UNLISTED file</div></div><button class="secondary small" data-action="restore">Import</button></div></div><div class="card"><div class="row-title">Cloud backup</div><p class="compact-note">Automatic Google/iCloud cloud sync is not connected in this first release. You can use the Backup button to save a private copy in iCloud Drive manually. Your everyday edits are saved locally automatically.</p><span class="pill planned">Not connected</span></div><div class="card"><div class="row-title">Budget targets</div><p class="compact-note">Planning guidance based on your preferred framework. Shipping is tracked separately, and there is no salaries category.</p>${[['Production + packaging',current().targets?.production??40],['Media buying',current().targets?.marketing??20],['Content',current().targets?.content??5],['Profit target',current().targets?.profit??30],['Unallocated',Math.max(0,100-Object.values(current().targets||{production:40,marketing:20,content:5,profit:30}).reduce((a,b)=>a+num(b),0))]].map(([name,value])=>`<div class="target-row"><span class="label">${name}</span><div class="bar"><span style="width:${value}%"></span></div><strong style="font-size:12px;text-align:right">${value}%</strong></div>`).join('')}<p class="compact-note">These are reference targets, not guarantees of profit. No salaries category.</p><button class="secondary small" data-action="edit-targets">Edit targets</button></div><div class="card"><div class="row-title">About</div><p class="compact-note">UNLISTED Finance Manager v1.0 · Offline-first · EGP<br>No bank connection, tracking scripts or advertising code.</p></div><input type="file" id="import-file" accept=".json,application/json" hidden>`;}
function render(){if(!data)return;const app=document.getElementById('app');app.innerHTML=`<div class="shell">${header()}${page==='drops'?renderDrops():page==='overview'?renderOverview():page==='expenses'?renderExpenses():page==='orders'?renderOrders():page==='products'?renderProducts():renderSettings()}</div>${nav()}`; if(modal)showModal(modal);}
function notify(msg){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2600);}
function field(name,label,value='',type='text',extra=''){return `<div class="field"><label for="f-${h(name)}">${label}</label><input id="f-${h(name)}" name="${h(name)}" type="${h(type)}" value="${h(value)}" ${extra}></div>`;}
function selectField(name,label,options,selected){return `<div class="field"><label for="f-${h(name)}">${label}</label><select id="f-${h(name)}" name="${h(name)}">${options.map(([v,txt])=>`<option value="${h(v)}" ${selected===v?'selected':''}>${h(txt)}</option>`).join('')}</select></div>`;}
function getModalHtml(m){const d=current();if(m.type==='drop'){const obj=m.id?data.drops.find(x=>x.id===m.id):null;return `<h2>${obj?'Edit Drop':'New Drop'}</h2>${field('name','Drop name',obj?.name||`Drop ${data.drops.length+2}`,'text','required maxlength="70"')}${field('shippingEstimate','Estimated shipping per unsold piece (EGP)',obj?.shippingEstimate??40,'number','required min="0" step="0.01"')}<p class="form-footnote">The estimate is replaced by real courier fees for delivered orders.</p>`;}
 if(m.type==='expense'){const obj=m.id?d.expenses.find(x=>x.id===m.id):null;return `<h2>${obj?'Edit Expense':'Add Expense'}</h2>${field('name','What was the expense?',obj?.name||'','text','required maxlength="120"')}${field('amount','Amount (EGP)',obj?.amount??'','number','required min="0" step="0.01"')}<div class="field"><label for="f-category">Category (you can type a new one)</label><input id="f-category" name="category" list="expense-categories" value="${h(obj?.category||'Fabric')}" required maxlength="50"><datalist id="expense-categories">${CATEGORIES.map(c=>`<option value="${h(c)}"></option>`).join('')}</datalist></div>${selectField('scope','Assign cost to',[['all','Shared across products'],...d.products.map(p=>[p.id,p.name])],obj?.scope||'all')}<label class="toggleline"><input type="checkbox" name="planned" ${obj?.planned?'checked':''}> Planned / not yet confirmed</label>`;}
 if(m.type==='product'){const obj=m.id?findProduct(d,m.id):null;return `<h2>${obj?'Edit Product':'Add Product'}</h2>${field('name','Product name',obj?.name||'','text','required maxlength="90"')}<div class="field-grid">${field('quantity','Units',obj?.quantity??'','number','required min="0" step="1"')}${field('price','Selling price (EGP)',obj?.price??'','number','required min="0" step="0.01"')}</div><p class="form-footnote">To give this product its own manufacturing or fabric cost, assign an expense to it from the Expenses screen.</p>`;}
 if(m.type==='targets'){const t=d.targets||{production:40,marketing:20,content:5,profit:30};return `<h2>Budget targets</h2><p class="compact-note">Each target is a percentage of sales. Shipping is accounted for separately as an actual expense.</p><div class="field-grid">${field('production','Production + packaging %',t.production,'number','min="0" max="100" step="0.5"')}${field('marketing','Media buying %',t.marketing,'number','min="0" max="100" step="0.5"')}${field('content','Content %',t.content,'number','min="0" max="100" step="0.5"')}${field('profit','Profit goal %',t.profit,'number','min="0" max="100" step="0.5"')}</div><p class="form-footnote">Any remaining percentage stays unallocated.</p>`;}
 if(m.type==='order'){const obj=m.id?d.orders.find(x=>x.id===m.id):null;const order=obj||{ref:`ORD-${String(d.orders.length+1).padStart(3,'0')}`,date:new Date().toISOString().slice(0,10),status:'pending',lines:[{productId:d.products[0]?.id,quantity:1,price:d.products[0]?.price??0}],courierFee:0,customerShipping:0,discount:0,courierCharged:false};
 return `<h2>${obj?'Edit Order':'New Order'}</h2><div class="field-grid">${field('ref','Order reference',order.ref,'text','required maxlength="70"')}${field('date','Date',order.date,'date','required')}</div>${selectField('status','Status',[['pending','Pending'],['delivered','Delivered'],['cancelled','Cancelled'],['returned','Returned']],order.status)}<div class="field"><label>Products on this order</label><div class="order-lines" id="order-lines">${order.lines.map(line=>orderLineHtml(d,line)).join('')}</div><button type="button" class="secondary small" id="add-order-line" style="align-self:flex-start;margin-top:6px">+ Another product</button></div><div class="field-grid">${field('discount','Order discount (EGP)',order.discount,'number','min="0" step="0.01"')}${field('customerShipping','Shipping customer pays (EGP)',order.customerShipping,'number','min="0" step="0.01"')}</div>${field('courierFee','Courier charges (EGP)',order.courierFee,'number','min="0" step="0.01"')}<label class="toggleline"><input type="checkbox" name="courierCharged" ${order.courierCharged?'checked':''}> Courier fee was actually charged to us</label><p class="form-footnote">Delivered orders count as revenue. If the courier charged you for cancelled or pending orders, tick the checkbox to include that expense. A returned order has zero revenue in this simplified version.</p>`;
 }return '<h2>Unknown form</h2>';
}
function orderLineHtml(d,line){const choices=d.products.map(p=>`<option value="${h(p.id)}" ${p.id===line.productId?'selected':''}>${h(p.name)}</option>`).join('');return `<div class="order-line"><div class="field" style="margin:0"><label>Product</label><select class="line-product" required>${choices}</select></div><div class="field" style="margin:0"><label>Qty</label><input type="number" class="line-qty" value="${h(line.quantity??1)}" min="1" step="1" required></div><div class="field" style="margin:0"><label>Price</label><input type="number" class="line-price" value="${h(line.price??0)}" min="0" step="0.01" required></div><button type="button" class="remove-line" title="Remove product">×</button></div>`;}
function showModal(m){document.querySelector('.sheet-backdrop')?.remove();const el=document.createElement('div');el.className='sheet-backdrop';el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Edit ${h(m.type)}"><div class="sheet-handle"></div><form id="item-form" data-type="${h(m.type)}">${getModalHtml(m)}<div class="form-actions"><button type="button" class="secondary" id="cancel-modal">Cancel</button><button class="primary" type="submit">Save ${m.type==='drop'?'drop':m.type}</button></div>${m.id?`<button type="button" class="form-delete" id="delete-entry">Delete ${m.type}</button>`:''}</form></div>`;document.body.appendChild(el);
 el.addEventListener('click',e=>{if(e.target===el||e.target.closest('#cancel-modal'))closeModal();if(e.target.closest('#delete-entry'))deleteCurrentEntry();if(e.target.closest('#add-order-line')){const d=current();document.querySelector('#order-lines')?.insertAdjacentHTML('beforeend',orderLineHtml(d,{productId:d.products[0]?.id,quantity:1,price:d.products[0]?.price??0}));}if(e.target.closest('.remove-line')){if(el.querySelectorAll('.order-line').length>1)e.target.closest('.order-line').remove();else notify('An order needs at least one product');}});
 el.addEventListener('change',e=>{if(e.target.classList.contains('line-product')){const p=findProduct(current(),e.target.value);if(p)e.target.closest('.order-line').querySelector('.line-price').value=p.price;}if(e.target.name==='status'&&e.target.value==='delivered'){const charged=el.querySelector('[name=courierCharged]');if(charged&&!charged.checked)charged.checked=true;}});
 el.querySelector('form').addEventListener('submit',saveEntry);
 el.querySelector('input,select')?.focus({preventScroll:true});
}
function closeModal(){modal=null;document.querySelector('.sheet-backdrop')?.remove();}
function saveEntry(e){e.preventDefault();const f=e.currentTarget;const v=new FormData(f);const m=modal,d=current();if(!m)return;
 const get=name=>String(v.get(name)||'').trim();
 if(m.type==='drop'){const name=get('name');if(!name)return;const incoming={name,shippingEstimate:num(get('shippingEstimate'))};if(m.id)Object.assign(data.drops.find(x=>x.id===m.id),incoming);else{const newdrop={id:id(),created:new Date().toISOString().slice(0,10),...incoming,products:[],expenses:[],orders:[],targets:{production:40,marketing:20,content:5,profit:30}};data.drops.push(newdrop);data.activeDropId=newdrop.id;page='overview';}}
 else if(m.type==='expense'){const incoming={name:get('name'),amount:num(get('amount')),category:get('category'),scope:get('scope'),planned:!!v.get('planned')};if(!incoming.name)return;if(m.id)Object.assign(d.expenses.find(x=>x.id===m.id),incoming);else d.expenses.push({id:id(),...incoming});}
 else if(m.type==='targets'){const targets={production:num(get('production')),marketing:num(get('marketing')),content:num(get('content')),profit:num(get('profit'))};if(Object.values(targets).reduce((a,b)=>a+b,0)>100){notify('Targets cannot exceed 100% in total');return;}d.targets=targets;}
 else if(m.type==='product'){const incoming={name:get('name'),quantity:Math.floor(num(get('quantity'))),price:num(get('price'))};if(!incoming.name)return;if(m.id)Object.assign(findProduct(d,m.id),incoming);else d.products.push({id:id(),...incoming});}
 else if(m.type==='order'){const lines=[...f.querySelectorAll('.order-line')].map(row=>({productId:row.querySelector('.line-product').value,quantity:Math.max(1,Math.floor(num(row.querySelector('.line-qty').value))),price:num(row.querySelector('.line-price').value)}));if(!lines.length||lines.some(l=>!l.productId)){notify('Add at least one valid product');return;}const incoming={ref:get('ref'),date:get('date'),status:get('status'),lines,discount:num(get('discount')),courierFee:num(get('courierFee')),customerShipping:num(get('customerShipping')),courierCharged:!!v.get('courierCharged')};if(!incoming.ref)return;if(m.id)Object.assign(d.orders.find(x=>x.id===m.id),incoming);else d.orders.push({id:id(),...incoming});}
 closeModal();save();notify('Saved successfully');}
function deleteCurrentEntry(){const m=modal;if(!m?.id)return;const d=current();if(!confirm(`Delete this ${m.type}? This cannot be undone.`))return;
 if(m.type==='drop'){if(data.drops.length===1){notify('Keep at least one drop');return;}data.drops=data.drops.filter(x=>x.id!==m.id);data.activeDropId=data.drops[0].id;page='drops';}
 if(m.type==='expense')d.expenses=d.expenses.filter(x=>x.id!==m.id);
 if(m.type==='product'){if(d.orders.some(o=>o.lines.some(l=>l.productId===m.id))){notify('This product is used in orders and cannot be deleted');return;}d.products=d.products.filter(x=>x.id!==m.id);d.expenses.forEach(e=>{if(e.scope===m.id)e.scope='all'});}
 if(m.type==='order')d.orders=d.orders.filter(x=>x.id!==m.id);
 closeModal();save();notify('Deleted');}
function backupFile(){return new File([JSON.stringify({app:'UNLISTED Finance Manager',exportedAt:new Date().toISOString(),data},null,2)],`UNLISTED-finances-${new Date().toISOString().slice(0,10)}.json`,{type:'application/json'});}
async function backup(){const file=backupFile();try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'UNLISTED finance backup'});return;}}catch(e){if(e.name==='AbortError')return;}
 const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);notify('Backup downloaded');}
async function importBackup(file){if(!file)return;try{const parsed=JSON.parse(await file.text());const next=parsed.data;if(parsed.app!=='UNLISTED Finance Manager'||!next||!Array.isArray(next.drops)||!next.drops.length||next.drops.some(d=>!Array.isArray(d.products)||!Array.isArray(d.expenses)||!Array.isArray(d.orders)))throw new Error('Invalid backup');if(!confirm('Replace all current local finance data with this backup? Export your current data first if needed.'))return;data=next;data.activeDropId=data.drops.some(d=>d.id===data.activeDropId)?data.activeDropId:data.drops[0].id;page='drops';save();notify('Backup restored');}catch(e){notify('Could not read this backup file');}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;const d=current();
 if(a==='navigate'){page=btn.dataset.page;filter='All';render();scrollTo({top:0,behavior:'instant'});}
 if(a==='settings'){page='settings';render();scrollTo({top:0,behavior:'instant'});}
 if(a==='open-drop'){data.activeDropId=btn.dataset.id;page='overview';filter='All';save();scrollTo({top:0,behavior:'instant'});}
 if(a==='add-drop'){modal={type:'drop'};showModal(modal);}
 if(a==='edit-drop'){modal={type:'drop',id:d.id};showModal(modal);}
 if(a==='edit-targets'){modal={type:'targets'};showModal(modal);}
